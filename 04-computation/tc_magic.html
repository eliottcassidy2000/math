<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC — Tournament Compression Sandbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#161b22;border-bottom:1px solid #30363d}
.top h1{font-size:1.3em;background:linear-gradient(90deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.toggle{display:flex;gap:8px;align-items:center}
.toggle label{font-size:.85em;color:#8b949e;cursor:pointer}
.toggle input{display:none}
.sw{width:40px;height:22px;background:#30363d;border-radius:11px;position:relative;cursor:pointer;transition:.2s}
.sw::after{content:'';width:18px;height:18px;background:#8b949e;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}
.sw.on{background:#238636}.sw.on::after{left:20px;background:#fff}
.main{display:flex;height:calc(100vh - 44px)}
.panel{flex:1;padding:12px;overflow:auto;border-right:1px solid #21262d}
.panel:last-child{border:none}
.panel h3{color:#58a6ff;margin-bottom:8px;font-size:.95em}
canvas{border:1px solid #30363d;border-radius:4px;cursor:crosshair;image-rendering:auto;max-width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat{background:#0d1117;border-radius:6px;padding:8px;text-align:center}
.stat .v{font-size:1.4em;font-weight:bold;color:#3fb950}
.stat .l{font-size:.7em;color:#8b949e}
textarea{width:100%;background:#0d1117;color:#8b949e;border:1px solid #30363d;border-radius:4px;font-family:'SF Mono',Monaco,monospace;font-size:.7em;padding:6px;resize:vertical}
.bar{height:20px;border-radius:4px;margin:4px 0;display:flex;align-items:center;padding:0 8px;font-size:.75em;color:#fff}
.bar.tc{background:linear-gradient(90deg,#238636,#3fb950)}
.bar.png{background:#6e40c9}
.drop{border:2px dashed #30363d;border-radius:8px;padding:30px 10px;text-align:center;cursor:pointer;margin:8px 0}
.drop:hover{border-color:#3fb950;background:#0d1117}
.drop input{display:none}
.toolbar{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.btn{background:#30363d;border:none;color:#e0e0e0;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:.8em}
.btn:hover{background:#484f58}
.btn.active{background:#238636;color:#fff}
.mono{font-family:'SF Mono',Monaco,monospace;font-size:.8em}
@media(max-width:700px){.main{flex-direction:column}.panel{border-right:none;border-bottom:1px solid #21262d}}
</style>
</head>
<body>
<div class="top">
<h1>TC Sandbox</h1>
<div class="toggle">
<label>Standard</label>
<div class="sw" id="modeSw" onclick="toggleMode()"></div>
<label>Interactive</label>
</div>
</div>
<div class="main">
<div class="panel" id="leftPanel">
<h3>Image</h3>
<div class="drop" id="dropZone">
<p>📷 Drop image here</p>
<p style="color:#484f58;font-size:.8em">or click to browse</p>
<input type="file" id="fileIn" accept="image/*,video/*">
</div>
<div class="toolbar" id="drawTools" style="display:none">
<button class="btn active" id="btnDraw" onclick="setTool('draw')">✏️ Draw</button>
<button class="btn" id="btnErase" onclick="setTool('erase')">🧹 Erase</button>
<button class="btn" onclick="clearDrawing()">🗑 Clear</button>
<span class="mono" id="brushInfo" style="color:#8b949e;padding:5px">red 3px</span>
</div>
<canvas id="imgCanvas" width="400" height="300"></canvas>
<div class="stats" id="statsArea">
<div class="stat"><div class="v" id="tcSizeEl">—</div><div class="l">TC bytes</div></div>
<div class="stat"><div class="v" id="pngSizeEl">—</div><div class="l">PNG bytes</div></div>
<div class="stat"><div class="v" id="ratioEl">—</div><div class="l">TC/PNG</div></div>
<div class="stat"><div class="v" id="timeEl">—</div><div class="l">ms</div></div>
</div>
<div style="margin:4px 0">
<div class="bar tc" id="tcBar" style="width:50%">TC</div>
<div class="bar png" id="pngBar" style="width:50%">PNG</div>
</div>
</div>
<div class="panel" id="rightPanel">
<h3>Encoded Data <span class="mono" style="color:#484f58" id="encLabel">(hex dump of filtered stream)</span></h3>
<textarea id="hexArea" rows="20" spellcheck="false" readonly></textarea>
<p style="color:#484f58;font-size:.75em;margin-top:4px" id="editHint" style="display:none">Edit hex → image updates live</p>
</div>
</div>

<script>
let interactive = false;
let currentTool = 'draw';
let drawing = false;
let imgW = 0, imgH = 0;
let origPixels = null; // RGBA Uint8ClampedArray
let filteredData = null; // the encoded stream

const canvas = document.getElementById('imgCanvas');
const ctx = canvas.getContext('2d');
const hexArea = document.getElementById('hexArea');
const dropZone = document.getElementById('dropZone');
const fileIn = document.getElementById('fileIn');

// ================================================================
// TC ENGINE (same as before, inline)
// ================================================================
function rgbToYCoCg(r,g,b){const co=r-b;const t=b+(co>>1);const cg=g-t;const y=t+(cg>>1);return[y&0xFF,(co+128)&0xFF,(cg+128)&0xFF]}
function ycoCgToRgb(y,co8,cg8){const co=co8-128,cg=cg8-128;const t=y-(cg>>1);return[(t-(co>>1)+co)&0xFF,(t+cg)&0xFF,(t-(co>>1))&0xFF]}
function paeth(a,b,c){const p=a+b-c,pa=Math.abs(p-a),pb=Math.abs(p-b),pc=Math.abs(p-c);return pa<=pb&&pa<=pc?a:pb<=pc?b:c}

function filterRow(row,above,bpp,f){
  const n=row.length,out=new Uint8Array(n);
  for(let j=0;j<n;j++){
    const a=j>=bpp?row[j-bpp]:0,b=above[j],c=j>=bpp?above[j-bpp]:0;
    if(f===0)out[j]=row[j];else if(f===1)out[j]=(row[j]-a)&0xFF;
    else if(f===2)out[j]=(row[j]-b)&0xFF;else if(f===3)out[j]=(row[j]-((a+b)>>1))&0xFF;
    else out[j]=(row[j]-paeth(a,b,c))&0xFF;
  }return out;
}

function unfilterRow(filt,above,bpp,f){
  const n=filt.length,out=new Uint8Array(n);
  for(let j=0;j<n;j++){
    const a=j>=bpp?out[j-bpp]:0,b=above[j],c=j>=bpp?above[j-bpp]:0;
    if(f===0)out[j]=filt[j];else if(f===1)out[j]=(filt[j]+a)&0xFF;
    else if(f===2)out[j]=(filt[j]+b)&0xFF;else if(f===3)out[j]=(filt[j]+((a+b)>>1))&0xFF;
    else out[j]=(filt[j]+paeth(a,b,c))&0xFF;
  }return out;
}

function bestFilter(row,above,bpp){
  let bf=0,bs=Infinity;
  for(let f=0;f<5;f++){
    const fr=filterRow(row,above,bpp,f);
    let s=0;for(let j=0;j<fr.length;j++){const v=fr[j];s+=v<128?v:256-v;}
    if(s<bs){bs=s;bf=f;}
  }return bf;
}

function encode(imageData,w,h){
  const bpp=3,rw=w*bpp;
  // YCoCg-R
  const trans=new Uint8Array(w*h*3);
  for(let i=0;i<w*h;i++){
    const[y,co,cg]=rgbToYCoCg(imageData.data[i*4],imageData.data[i*4+1],imageData.data[i*4+2]);
    trans[i*3]=y;trans[i*3+1]=co;trans[i*3+2]=cg;
  }
  // Adaptive filter
  const out=[];let above=new Uint8Array(rw);
  for(let i=0;i<h;i++){
    const row=trans.subarray(i*rw,(i+1)*rw);
    const f=bestFilter(row,above,bpp);
    const fr=filterRow(row,above,bpp,f);
    out.push(f);for(let j=0;j<rw;j++)out.push(fr[j]);
    above=row;
  }
  return new Uint8Array(out);
}

function decode(encoded,w,h){
  const bpp=3,rw=w*bpp;
  // Undo filter
  const trans=new Uint8Array(w*h*3);
  let above=new Uint8Array(rw);
  for(let i=0;i<h;i++){
    const f=encoded[i*(1+rw)];
    const filt=encoded.subarray(i*(1+rw)+1,(i+1)*(1+rw));
    const row=unfilterRow(filt,above,bpp,f);
    trans.set(row,i*rw);above=row;
  }
  // Undo YCoCg-R
  const rgba=new Uint8ClampedArray(w*h*4);
  for(let i=0;i<w*h;i++){
    const[r,g,b]=ycoCgToRgb(trans[i*3],trans[i*3+1],trans[i*3+2]);
    rgba[i*4]=r;rgba[i*4+1]=g;rgba[i*4+2]=b;rgba[i*4+3]=255;
  }
  return new ImageData(rgba,w,h);
}

function estimateSize(data){
  const n=data.length;if(n===0)return 13;
  const counts=new Array(256).fill(0);for(let i=0;i<n;i++)counts[data[i]]++;
  let h=0;for(const c of counts)if(c>0){const p=c/n;h-=p*Math.log2(p);}
  let nUnique=0;for(let i=0;i<256;i++)if(counts[i]>0)nUnique++;
  const factor=h>7?1.02:h<2?1.0:0.88;
  return Math.max(Math.ceil(h*n/8*factor),Math.ceil(n/1000)+13)+13;
}

// ================================================================
// MODE TOGGLE
// ================================================================
function toggleMode(){
  interactive=!interactive;
  document.getElementById('modeSw').classList.toggle('on',interactive);
  document.getElementById('drawTools').style.display=interactive?'flex':'none';
  document.getElementById('editHint').style.display=interactive?'block':'none';
  hexArea.readOnly=!interactive;
  if(interactive&&origPixels)updateAll();
}

function setTool(t){
  currentTool=t;
  document.getElementById('btnDraw').classList.toggle('active',t==='draw');
  document.getElementById('btnErase').classList.toggle('active',t==='erase');
  document.getElementById('brushInfo').textContent=t==='draw'?'red 3px':'white 3px';
}

function clearDrawing(){
  if(!origPixels)return;
  const id=new ImageData(new Uint8ClampedArray(origPixels),imgW,imgH);
  ctx.putImageData(id,0,0);
  updateFromCanvas();
}

// ================================================================
// DRAWING
// ================================================================
canvas.addEventListener('mousedown',e=>{if(!interactive)return;drawing=true;drawAt(e);});
canvas.addEventListener('mousemove',e=>{if(!interactive||!drawing)return;drawAt(e);});
canvas.addEventListener('mouseup',()=>{if(!interactive)return;drawing=false;updateFromCanvas();});
canvas.addEventListener('mouseleave',()=>{if(!interactive)return;drawing=false;if(origPixels)updateFromCanvas();});

// Touch support
canvas.addEventListener('touchstart',e=>{if(!interactive)return;e.preventDefault();drawing=true;drawAtTouch(e);});
canvas.addEventListener('touchmove',e=>{if(!interactive)return;e.preventDefault();drawAtTouch(e);});
canvas.addEventListener('touchend',()=>{if(!interactive)return;drawing=false;updateFromCanvas();});

function drawAt(e){
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*canvas.width/rect.width;
  const y=(e.clientY-rect.top)*canvas.height/rect.height;
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fillStyle=currentTool==='draw'?'#ff3333':'#ffffff';
  ctx.fill();
}

function drawAtTouch(e){
  const t=e.touches[0];const rect=canvas.getBoundingClientRect();
  const x=(t.clientX-rect.left)*canvas.width/rect.width;
  const y=(t.clientY-rect.top)*canvas.height/rect.height;
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fillStyle=currentTool==='draw'?'#ff3333':'#ffffff';
  ctx.fill();
}

// ================================================================
// UPDATE CYCLE: canvas → encode → hex display + stats
// ================================================================
let updateTimer=null;

function updateFromCanvas(){
  if(updateTimer)clearTimeout(updateTimer);
  updateTimer=setTimeout(()=>{
    const id=ctx.getImageData(0,0,imgW,imgH);
    const t0=performance.now();
    filteredData=encode(id,imgW,imgH);
    const elapsed=performance.now()-t0;
    const tcSize=estimateSize(filteredData);

    // PNG size from blob
    canvas.toBlob(blob=>{
      const pngSize=blob?blob.size:imgW*imgH*3;
      updateDisplay(tcSize,pngSize,elapsed);
    },'image/png');

    // Update hex dump
    updateHex(filteredData);
  },50);
}

function updateDisplay(tcSize,pngSize,elapsed){
  document.getElementById('tcSizeEl').textContent=tcSize.toLocaleString();
  document.getElementById('pngSizeEl').textContent=pngSize.toLocaleString();
  const ratio=(tcSize/pngSize).toFixed(3);
  document.getElementById('ratioEl').textContent=ratio+'×';
  document.getElementById('ratioEl').style.color=tcSize<pngSize?'#3fb950':'#f78166';
  document.getElementById('timeEl').textContent=elapsed.toFixed(0);

  const max=Math.max(tcSize,pngSize);
  document.getElementById('tcBar').style.width=Math.max(5,tcSize/max*100)+'%';
  document.getElementById('tcBar').textContent='TC '+tcSize.toLocaleString();
  document.getElementById('pngBar').style.width=Math.max(5,pngSize/max*100)+'%';
  document.getElementById('pngBar').textContent='PNG '+pngSize.toLocaleString();
}

function updateHex(data){
  // Show first ~2000 bytes as hex
  const show=Math.min(data.length,2000);
  let hex='';
  for(let i=0;i<show;i++){
    hex+=data[i].toString(16).padStart(2,'0');
    if((i+1)%32===0)hex+='\n';else if((i+1)%2===0)hex+=' ';
  }
  if(show<data.length)hex+='\n... ('+data.length+' bytes total)';
  hexArea.value=hex;
}

// ================================================================
// REVERSE: hex edit → decode → canvas update
// ================================================================
hexArea.addEventListener('input',()=>{
  if(!interactive||!filteredData)return;
  if(updateTimer)clearTimeout(updateTimer);
  updateTimer=setTimeout(()=>{
    try{
      // Parse hex back to bytes
      const raw=hexArea.value.replace(/[^0-9a-fA-F]/g,'');
      const bytes=new Uint8Array(Math.min(raw.length/2,filteredData.length));
      for(let i=0;i<bytes.length;i++){
        bytes[i]=parseInt(raw.substr(i*2,2),16);
      }
      // Pad with original data if hex is shorter
      const full=new Uint8Array(filteredData.length);
      full.set(filteredData);
      full.set(bytes);

      // Decode and display
      const decoded=decode(full,imgW,imgH);
      ctx.putImageData(decoded,0,0);

      // Update stats
      const tcSize=estimateSize(full);
      canvas.toBlob(blob=>{
        const pngSize=blob?blob.size:imgW*imgH*3;
        updateDisplay(tcSize,pngSize,0);
      },'image/png');
    }catch(e){/* ignore parse errors during typing */}
  },200);
});

// ================================================================
// FILE HANDLING
// ================================================================
dropZone.addEventListener('dragover',e=>{e.preventDefault();});
dropZone.addEventListener('drop',e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);});
fileIn.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
dropZone.addEventListener('click',()=>fileIn.click());

function handleFile(file){
  if(!file)return;
  const url=URL.createObjectURL(file);

  if(file.type.startsWith('video/')){
    const vid=document.createElement('video');vid.muted=true;vid.preload='auto';
    vid.onloadeddata=()=>{vid.currentTime=Math.min(1,vid.duration/2);};
    vid.onseeked=()=>{loadFrame(vid,vid.videoWidth,vid.videoHeight);URL.revokeObjectURL(url);};
    vid.src=url;
  }else{
    const img=new Image();
    img.onload=()=>{loadFrame(img,img.width,img.height);URL.revokeObjectURL(url);};
    img.src=url;
  }
}

function loadFrame(source,sw,sh){
  // Scale to max 400px
  const max=400;let w=sw,h=sh;
  if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  canvas.width=w;canvas.height=h;imgW=w;imgH=h;
  ctx.drawImage(source,0,0,w,h);

  // Save original pixels
  origPixels=new Uint8ClampedArray(ctx.getImageData(0,0,w,h).data);

  // Initial encode
  updateFromCanvas();
  dropZone.style.display='none';
}

function updateAll(){if(origPixels)updateFromCanvas();}
</script>
</body>
</html>
