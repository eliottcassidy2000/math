<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Two hourglasses, one labelled carrier</title><desc id="desc">The horizontal and vertical seven-cell hourglasses share four corners and center. In the additive K3,3 edge-value grid these five shared cells form a spanning tree; each hourglass contributes two chords.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50" y="58" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172b40">Two hourglasses, one labelled carrier</text>
<text x="50" y="94" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#4e6175">Same nine values, different placements. The arithmetic travels with the labels.</text>
<rect x="50" y="117" width="20" height="20" rx="4" fill="#e2e8ee" stroke="none"/>
<text x="80" y="133" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#4e6175">Shared: 5 cells</text>
<rect x="330" y="117" width="20" height="20" rx="4" fill="#d7eafe" stroke="none"/>
<text x="360" y="133" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#4e6175">Horizontal only: 2</text>
<rect x="660" y="117" width="20" height="20" rx="4" fill="#ffe5c8" stroke="none"/>
<text x="690" y="133" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#4e6175">Vertical only: 2</text>
<rect x="36" y="163" width="650" height="482" rx="12" fill="#f7f9fb" stroke="none"/>
<rect x="710" y="163" width="694" height="482" rx="12" fill="#f7f9fb" stroke="none"/>
<text x="60" y="202" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172b40">MAGIC-SQUARE PLACEMENT</text>
<text x="60" y="235" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#4e6175">Horizontal = top + center + bottom; vertical = rotation.</text>
<rect x="100" y="260" width="164" height="96" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="112" y="283" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">A</text>
<text x="182.0" y="321" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + x</text>
<rect x="274" y="260" width="164" height="96" rx="7" fill="#d7eafe" stroke="#ffffff"/>
<text x="286" y="283" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">B</text>
<text x="356.0" y="321" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − x − z</text>
<rect x="448" y="260" width="164" height="96" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="460" y="283" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">C</text>
<text x="530.0" y="321" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + z</text>
<rect x="100" y="366" width="164" height="96" rx="7" fill="#ffe5c8" stroke="#ffffff"/>
<text x="112" y="389" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">D</text>
<text x="182.0" y="427" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − x + z</text>
<rect x="274" y="366" width="164" height="96" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="286" y="389" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">E</text>
<text x="356.0" y="427" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E</text>
<rect x="448" y="366" width="164" height="96" rx="7" fill="#ffe5c8" stroke="#ffffff"/>
<text x="460" y="389" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">F</text>
<text x="530.0" y="427" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + x − z</text>
<rect x="100" y="472" width="164" height="96" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="112" y="495" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">G</text>
<text x="182.0" y="533" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − z</text>
<rect x="274" y="472" width="164" height="96" rx="7" fill="#d7eafe" stroke="#ffffff"/>
<text x="286" y="495" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">H</text>
<text x="356.0" y="533" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + x + z</text>
<rect x="448" y="472" width="164" height="96" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="460" y="495" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">I</text>
<text x="530.0" y="533" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − x</text>
<text x="60" y="607" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#172b40">7 + 7 − 5 = 9 cells; 5 + 5 − 2 = 8 magic lines.</text>
<text x="734" y="202" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172b40">AP–K₃,₃ EDGE-VALUE GRID</text>
<text x="734" y="235" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#4e6175">Each table entry labels an edge, not a graph vertex.</text>
<text x="910" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#172b40">B₋₁ = E − z</text>
<text x="1068" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#172b40">B₀ = E</text>
<text x="1226" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#172b40">B₁ = E + z</text>
<text x="823" y="353" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#172b40">A₋₁ = −x</text>
<text x="823" y="449" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#172b40">A₀ = 0</text>
<text x="823" y="545" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#172b40">A₁ = x</text>
<rect x="835" y="300" width="150" height="88" rx="7" fill="#d7eafe" stroke="#ffffff"/>
<text x="847" y="323" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">B</text>
<text x="910.0" y="361" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − x − z</text>
<rect x="993" y="300" width="150" height="88" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="1005" y="323" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">I</text>
<text x="1068.0" y="361" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − x</text>
<rect x="1151" y="300" width="150" height="88" rx="7" fill="#ffe5c8" stroke="#ffffff"/>
<text x="1163" y="323" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">D</text>
<text x="1226.0" y="361" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − x + z</text>
<rect x="835" y="396" width="150" height="88" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="847" y="419" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">G</text>
<text x="910.0" y="457" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E − z</text>
<rect x="993" y="396" width="150" height="88" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="1005" y="419" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">E</text>
<text x="1068.0" y="457" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E</text>
<rect x="1151" y="396" width="150" height="88" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="1163" y="419" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">C</text>
<text x="1226.0" y="457" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + z</text>
<rect x="835" y="492" width="150" height="88" rx="7" fill="#ffe5c8" stroke="#ffffff"/>
<text x="847" y="515" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">F</text>
<text x="910.0" y="553" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + x − z</text>
<rect x="993" y="492" width="150" height="88" rx="7" fill="#e2e8ee" stroke="#ffffff"/>
<text x="1005" y="515" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">A</text>
<text x="1068.0" y="553" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + x</text>
<rect x="1151" y="492" width="150" height="88" rx="7" fill="#d7eafe" stroke="#ffffff"/>
<text x="1163" y="515" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#4e6175">H</text>
<text x="1226.0" y="553" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#172b40">E + x + z</text>
<text x="734" y="607" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#172b40">Vertex potentials: Aᵢ = ix, Bⱼ = E + jz. Edge: Lᵢⱼ = Aᵢ + Bⱼ.</text>
<text x="50" y="687" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#172b40">Five shared edges form a spanning tree</text>
<text x="50" y="725" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#172b40">Gray: i = 0 or j = 0. Blue: (−1,−1), (1,1). Orange: (−1,1), (1,−1).</text>
<text x="50" y="760" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#172b40">The two central AP equations reduce the five tree labels to E, x, z.</text>
<text x="50" y="795" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#172b40">Each colored pair adds two chords; together they close all four fundamental cycles.</text>
<path d="M50 822 L1390 822" fill="none" stroke="#a5b2bf" stroke-width="2"/>
<text x="50" y="854" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#172b40">Square gate: E and E ± x, E ± z, E ± (x + z), E ± (x − z) must be squares.</text>
<text x="50" y="881" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#4e6175">Structural equivalence only: no integer-square existence claim. Indexed potential vertices stay distinct even if numbers coincide.</text>
</svg>
