<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Distinct profiles need not be linearly complete</title><desc id="desc">At n=6, 34 distinct tournament converse-class profiles have linear rank 32. Adding two squared coordinates from observations conditional on the same latent class gives rank 34. This is not an individual-profile collision or an all-n quadratic claim.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50" y="58" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172b40">Distinct profiles ≠ linear completeness</text>
<text x="50" y="95" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#4e6175">Order-averaged graph-pair observer • exact finite result at n = 6</text>
<rect x="50" y="135" width="420" height="211" rx="12" fill="#e2e8ee" stroke="none"/>
<text x="75" y="214" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700" text-anchor="start" fill="#172b40">34</text>
<text x="75" y="259" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#172b40">converse classes</text>
<text x="75" y="310" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172b40">34 distinct individual profiles</text>
<rect x="510" y="135" width="420" height="211" rx="12" fill="#d7eafe" stroke="none"/>
<text x="535" y="214" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700" text-anchor="start" fill="#172b40">32</text>
<text x="535" y="259" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#172b40">first-moment rank</text>
<text x="535" y="310" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172b40">Two mixture directions are lost</text>
<rect x="970" y="135" width="420" height="211" rx="12" fill="#ffe5c8" stroke="none"/>
<text x="995" y="214" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700" text-anchor="start" fill="#172b40">34</text>
<text x="995" y="259" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#172b40">augmented rank</text>
<text x="995" y="310" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172b40">Two squared coordinates repair it</text>
<text x="480" y="247" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#172b40">→</text>
<text x="940" y="247" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#172b40">→</text>
<text x="50" y="390" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#172b40">Keep 32 independent linear coordinates; append Aₜ(3)² and Aₜ(15)².</text>
<text x="50" y="427" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#4e6175">q = 3: K₁,₂ + 3 isolated vertices.   q = 15: K₁,₄ + 1 isolated vertex.   Each paired with its complement.</text>
<rect x="50" y="458" width="1340" height="166" rx="12" fill="#f7f9fb" stroke="none"/>
<text x="75" y="496" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#172b40">SAME LATENT CLASS, TWO CONDITIONALLY INDEPENDENT ORDERS</text>
<text x="75" y="538" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172b40">Draw T once from μ. Then observe twice:  P(q, q) = Σₜ μ(T) [Aₜ(q) / 6!]².</text>
<text x="75" y="581" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#4e6175">Fresh independent draws of T give the square of a marginal, not this second moment.</text>
<text x="50" y="665" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#172b40">Exact certificate: a 34 × 34 integer minor has determinant</text>
<text x="50" y="701" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#172b40">211991592542375584355844096000000 ≠ 0.</text>
<text x="50" y="750" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#172b40">No individual-profile collision at n = 6. No claim that two squared coordinates suffice for all n.</text>
</svg>
