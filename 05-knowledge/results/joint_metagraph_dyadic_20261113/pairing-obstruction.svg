<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
<title id="title">Order-five pairing obstruction: four abstract fixed classes, eight with wiring</title>
<desc id="description">Two panels show all twelve ordinary tournament classes grouped by Hamilton-path count. The abstract optimal involution swaps the two self-converse classes of count nine and the two of count fifteen, leaving four fixed. Preserving the merged dart diagram blocks both swaps and forces eight fixed classes. The two chiral converse pairs remain exchangeable.</desc>
<metadata>{&quot;class_codes&quot;: [0, 2, 4, 5, 8, 9, 10, 11, 12, 40, 41, 76], &quot;ordinary_chiral_pairs&quot;: {&quot;3&quot;: [2, 11], &quot;5&quot;: [4, 9]}, &quot;scope&quot;: &quot;All 12 ordinary tournament classes at n=5; full merged dart wiring.&quot;, &quot;source_sha256&quot;: {&quot;PAIRING_WIRING.md&quot;: &quot;968aa6c1504f8c5868d58c71b50044509b0ba6a4c5f20b6c94185ab5fec10c3b&quot;, &quot;audit/small.normal.json&quot;: &quot;c5decd3d04c8704b16b311e86ba29208a7daf6cca13574b0854ba73ed33cb5b5&quot;}}</metadata>
