<text x="762" y="683" font-size="17" fill="#526573">All eight self-converse classes must stay fixed.</text>
<rect x="48" y="734" width="656" height="144" rx="10" fill="#f5f8fa"/>
<text x="72" y="768" font-size="21" font-weight="700">H = 9: degree alone misses the obstruction</text>
<text x="72" y="802" font-size="19">Codes 8 and 10 each have dart degree 9.</text>
<text x="72" y="833" font-size="19">Only code 10 meets the transitive class TT₅ (code 0).</text>
<text x="72" y="858" font-size="18" fill="#526573">Exchanging them changes that incidence.</text>
<rect x="736" y="734" width="656" height="144" rx="10" fill="#f5f8fa"/>
<text x="760" y="768" font-size="21" font-weight="700">H = 15: the degrees already disagree</text>
<text x="760" y="802" font-size="19">Code 40 has dart degree 5; code 76 has degree 3.</text>
<text x="760" y="833" font-size="19">Their exchange cannot preserve the merged diagram.</text>
<text x="760" y="858" font-size="18" fill="#526573">The two chiral pairs remain independently flippable.</text>
