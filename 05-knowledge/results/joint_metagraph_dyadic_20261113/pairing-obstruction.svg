<text x="1044" y="932" font-size="17">blocked by wiring</text>
<text x="48" y="982" font-size="17" fill="#526573">Fixed classes are gray; exchanged classes are teal. Wiring means the full merged dart multigraph, including multiplicity.</text>
<text x="48" y="1011" font-size="16" fill="#526573">FINITE-EXACT  •  Codes are minimum orientation bitmasks over vertex relabelings; the diagram displays ordinary classes.</text>
