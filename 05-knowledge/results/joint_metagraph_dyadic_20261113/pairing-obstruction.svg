<text x="671" y="932" font-size="17">exchanged by J</text>
<line x1="941" y1="925" x2="995" y2="925" stroke="#b55f30" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="962.0" y1="918" x2="974.0" y2="932" stroke="#b55f30" stroke-width="2.5" />
