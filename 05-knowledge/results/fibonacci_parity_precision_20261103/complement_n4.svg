<text x="975" y="375" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#303b49">Q4</text>
<text x="1051" y="321" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="19" fill="#303b49">degree 5</text>
<text x="300" y="577" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" fill="#303b49">Four disjoint complement pairs.</text>
<text x="975" y="577" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" fill="#303b49">Loops count twice. Every degree is odd.</text>
<text x="650" y="625" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" fill="#303b49">Blue and black are actual path-line colours. The quotient star has no perfect matching.</text>
<text x="650" y="674" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="20" fill="#303b49">Adding within-class re-markings gives class pairs: TT4 ↔ Q4 and (1 → C3) ↔ (C3 → 1).</text>
<text x="650" y="706" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="17" fill="#303b49">Actual chart trails: 0—7 and 3—4—5—2—1—6; the latter retains two re-markings inside Q4.</text>
</svg>
