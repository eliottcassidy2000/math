<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" viewBox="0 0 1360 650" role="img" aria-labelledby="title desc">
<title id="title">Twin primes: the line-graph isomorphism between two Berggren rays</title>
<desc id="desc">Prime odd-leg vertices3,5,7 form a two-edge component;11,13 form another edge. The twin edges map to the selected primitive triples15,8,17;35,12,37;143,24,145. Only the first two selected triples are adjacent. Their common square boundary25 maps by the aliquot sum to the perfect number6.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#697c94"/></marker></defs>
<rect width="1360" height="650" fill="#f8fafc"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#172b4d">
<text x="60" y="58" font-size="30" font-weight="700">Twin primes as an edge-to-vertex isomorphism</text>
<text x="60" y="94" font-size="19" fill="#53657b">L(H) ≅ J • parity-ordered primitive triples • first components shown</text>
<text x="60" y="153" font-size="22" font-weight="700">H: vertices with prime odd leg</text>
<line x1="189" y1="215" x2="371" y2="215" stroke="#227b8d" stroke-width="5"/>
<line x1="429" y1="215" x2="611" y2="215" stroke="#227b8d" stroke-width="5"/>
<line x1="1019" y1="215" x2="1201" y2="215" stroke="#227b8d" stroke-width="5"/>
<circle cx="160" cy="215" r="30" fill="#e3f3f1" stroke="#227b8d" stroke-width="2"/><text x="160" y="222" text-anchor="middle" font-size="23" font-weight="700">3</text><text x="160" y="270" text-anchor="middle" font-size="17">P(3)</text>
<circle cx="400" cy="215" r="30" fill="#e3f3f1" stroke="#227b8d" stroke-width="2"/><text x="400" y="222" text-anchor="middle" font-size="23" font-weight="700">5</text><text x="400" y="270" text-anchor="middle" font-size="17">P(5)</text>
<circle cx="640" cy="215" r="30" fill="#e3f3f1" stroke="#227b8d" stroke-width="2"/><text x="640" y="222" text-anchor="middle" font-size="23" font-weight="700">7</text><text x="640" y="270" text-anchor="middle" font-size="17">P(7)</text>
<circle cx="990" cy="215" r="30" fill="#e3f3f1" stroke="#227b8d" stroke-width="2"/><text x="990" y="222" text-anchor="middle" font-size="23" font-weight="700">11</text><text x="990" y="270" text-anchor="middle" font-size="17">P(11)</text>
<circle cx="1230" cy="215" r="30" fill="#e3f3f1" stroke="#227b8d" stroke-width="2"/><text x="1230" y="222" text-anchor="middle" font-size="23" font-weight="700">13</text><text x="1230" y="270" text-anchor="middle" font-size="17">P(13)</text>
<text x="812" y="223" text-anchor="middle" font-size="28" fill="#8d98a8">…</text>
<line x1="280" y1="235" x2="280" y2="384" stroke="#697c94" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><rect x="227" y="302" width="106" height="29" rx="8" fill="#f8fafc"/><text x="280" y="323" text-anchor="middle" font-size="18">(3,5)</text>
<line x1="520" y1="235" x2="520" y2="384" stroke="#697c94" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><rect x="467" y="302" width="106" height="29" rx="8" fill="#f8fafc"/><text x="520" y="323" text-anchor="middle" font-size="18">(5,7)</text>
<line x1="1110" y1="235" x2="1110" y2="384" stroke="#697c94" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><rect x="1057" y="302" width="106" height="29" rx="8" fill="#f8fafc"/><text x="1110" y="323" text-anchor="middle" font-size="18">(11,13)</text>
<text x="60" y="371" font-size="22" font-weight="700">J: selected triples</text>
<line x1="389" y1="429" x2="411" y2="429" stroke="#227b8d" stroke-width="5"/>
<rect x="171" y="395" width="218" height="81" rx="12" fill="white" stroke="#227b8d" stroke-width="2"/><text x="280" y="427" text-anchor="middle" font-size="23" font-weight="700">(15, 8, 17)</text><text x="280" y="457" text-anchor="middle" font-size="17" fill="#53657b">r = 3, ρ = 5</text>
<rect x="411" y="395" width="218" height="81" rx="12" fill="white" stroke="#227b8d" stroke-width="2"/><text x="520" y="427" text-anchor="middle" font-size="23" font-weight="700">(35, 12, 37)</text><text x="520" y="457" text-anchor="middle" font-size="17" fill="#53657b">r = 5, ρ = 7</text>
<rect x="1001" y="395" width="218" height="81" rx="12" fill="white" stroke="#227b8d" stroke-width="2"/><text x="1110" y="427" text-anchor="middle" font-size="23" font-weight="700">(143, 24, 145)</text><text x="1110" y="457" text-anchor="middle" font-size="17" fill="#53657b">r = 11, ρ = 13</text>
<rect x="130" y="504" width="540" height="53" rx="10" fill="#e6edf8"/>
<text x="400" y="537" text-anchor="middle" font-size="21">c+b = 25 = c′−b′  →  s(25)=6=s(6)</text>
<text x="1110" y="532" text-anchor="middle" font-size="18" fill="#53657b">isolated in J</text>
<text x="60" y="606" font-size="18" fill="#53657b">J has exactly one edge. Every other selected vertex is isolated; twin-prime infinitude remains open.</text>
</g></svg>
