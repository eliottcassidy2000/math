<text x="45" y="779" fill="#326ba8" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Blue arcs stay fixed: 0 → 2 and 4 → 2. All ten tournament arcs are shown.</text>
<text x="45" y="828" fill="#172b43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">All n: directed 3-/4-cycle moves on free edges connect every fixed-score, forest-locked fibre.</text>
<text x="45" y="863" fill="#b34836" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">They preserve the locked forest and scores, but need not preserve H mod 8 or full native wiring.</text>
