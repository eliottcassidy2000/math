<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">A locked path and equal scores do not fix Hamilton count</title><desc id="desc">Two full five-vertex tournaments with fixed path 0 to 1 to 2 to 3 to 4 and score vector (3,2,1,2,2). Their only fibre transition is a directed quadrilateral reversal; Hamilton path counts are 11 and 13.</desc><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#007f79"/></marker><marker id="mut" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#50637b"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#326ba8"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#b34836"/></marker></defs><rect width="1200" height="900" fill="#f6f8fc"/>
