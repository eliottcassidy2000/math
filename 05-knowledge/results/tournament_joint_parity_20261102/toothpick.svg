<text x="35" y="530" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Red: the fixed seed. Gold: one orbit of size 2.</text>
<text x="35" y="558" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">All later sticks have free four-reflection orbits.</text>
<text x="35" y="586" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Hence T(n) = 3 mod 4 for every n &gt;= 2.</text>
<text x="35" y="614" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Half-turn alone fixes only the seed: T(n) is odd.</text>
<line x1="530" y1="125" x2="530" y2="680" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
<text x="565" y="145" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Stage 3: why orbit counts lose the growth rule</text>
<line x1="685" y1="390" x2="685" y2="300" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
<line x1="685" y1="300" x2="685" y2="210" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
<line x1="685" y1="345" x2="775" y2="345" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<line x1="730" y1="345" x2="730" y2="255" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<line x1="685" y1="255" x2="775" y2="255" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<line x1="775" y1="390" x2="775" y2="300" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
<line x1="775" y1="300" x2="775" y2="210" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
<circle cx="685" cy="300" r="7" fill="#dc2626"/>
<circle cx="775" cy="300" r="7" fill="#dc2626"/>
<text x="875" y="245" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">4 reflected sticks</text>
<text x="875" y="275" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">2 physical collision ports</text>
<text x="875" y="305" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">4 endpoint incidences / 2 ports</text>
<text x="875" y="335" font-family="Arial,sans-serif" font-size="18" fill="#dc2626">= 2 incidences at each port</text>
<text x="565" y="435" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">The ports are blocked. One adjacent orbit does not mean one source.</text>
<text x="565" y="485" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">Tournament insertion has the analogous root-fiber loss:</text>
<text x="565" y="525" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">one order-2 class  -&gt;  four rooted order-3 classes</text>
<text x="565" y="560" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">three roots of the transitive class  +  one root orbit of the cycle</text>
<text x="565" y="595" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Forgetting the root gives only two ordinary classes.</text>
<text x="565" y="630" font-family="Arial,sans-serif" font-size="18" fill="#dc2626">Both are self-converse; H = 1 and H = 3.</text>
<text x="35" y="718" font-family="Arial,sans-serif" font-size="18" fill="#475569">Exact bridge: weighted orbit incidence. No toothpick-to-tournament bijection or shared dyadic recursion is claimed.</text>
</svg>
