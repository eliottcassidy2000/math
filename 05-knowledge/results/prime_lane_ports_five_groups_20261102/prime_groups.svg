<text x="825" y="145" font-family="Arial,sans-serif" font-size="23" fill="#14213d">Recovered groups</text>
<text x="825" y="193" font-family="Arial,sans-serif" font-size="18" fill="#2764a5">G1: 2,3,5,7,11,13</text>
<text x="825" y="220" font-family="Arial,sans-serif" font-size="15" fill="#14213d">prime divisors of Fi22</text>
<text x="825" y="279" font-family="Arial,sans-serif" font-size="18" fill="#a14ca1">G2: 17,19,23,31,47</text>
<text x="825" y="306" font-family="Arial,sans-serif" font-size="15" fill="#14213d">new prime divisors in Baby Monster</text>
<text x="825" y="365" font-family="Arial,sans-serif" font-size="18" fill="#cf8425">G3: 29,41,59,71</text>
<text x="825" y="392" font-family="Arial,sans-serif" font-size="15" fill="#14213d">new prime divisors in Monster</text>
<text x="825" y="451" font-family="Arial,sans-serif" font-size="18" fill="#168a75">G4: 37,43,53,61,67</text>
<text x="825" y="478" font-family="Arial,sans-serif" font-size="15" fill="#14213d">first five primes outside Monster support</text>
<text x="825" y="537" font-family="Arial,sans-serif" font-size="18" fill="#d45162">G5: 73,79,83,89,97</text>
<text x="825" y="564" font-family="Arial,sans-serif" font-size="15" fill="#14213d">remaining five below 100</text>
<text x="825" y="665" font-family="Arial,sans-serif" font-size="18" fill="#14213d">24 edges; components 22 + 1 + 1 + 1</text>
<text x="825" y="696" font-family="Arial,sans-serif" font-size="18" fill="#14213d">Cycle rank 3; no spanning path.</text>
<line x1="30" y1="740" x2="1230" y2="740" stroke="#cbd5e1" stroke-width="2"/>
<text x="30" y="778" font-family="Arial,sans-serif" font-size="21" fill="#14213d">Exact tournament bridge: choose K with H(K)=49; send T to the ordered join K -&gt; T.</text>
<text x="30" y="816" font-family="Arial,sans-serif" font-size="20" fill="#14213d">H becomes 49H, tournament order increases by 7, and each square root s becomes 7s.</text>
<text x="30" y="854" font-family="Arial,sans-serif" font-size="20" fill="#14213d">5 + 11 = 4^2  -&gt;  245 + 539 = 28^2.  Multiplication by 7 alone gives 35 + 77 = 112.</text>
<text x="30" y="891" font-family="Arial,sans-serif" font-size="17" fill="#14213d">The 24 odd primes lift to count labels 49p; an odd label for prime 2 cannot keep its edges to 23 and 47.</text>
</svg>
