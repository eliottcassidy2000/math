<title id="a">Three strands, two different coordinate systems</title><desc id="b">A strict summand row adds one pair of each color every six integers; a triangle of path-run occupancies uses a different diagonal charge. Both require an absolute anchor.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#20314d}.cap{font-size:16px;font-weight:700}.sm{font-size:12px}.mini{font-size:10px}</style></defs>
<rect width="970" height="450" fill="#f7f9fe"/><text x="32" y="43" font-size="25" font-weight="700">Three stripes do not identify an absolute target</text>
<text class="cap" x="33" y="85">Strict summands: (u, z − u)</text><text x="33" y="107" class="sm">Color = smaller parent u modulo 3.</text>
<text class="cap" x="544" y="85">Three-run Hamiltonian frame</text><text x="544" y="107" class="sm">Color = i₁ + 2i₂ modulo 3, where iᵣ is occupancy of run r.</text>
