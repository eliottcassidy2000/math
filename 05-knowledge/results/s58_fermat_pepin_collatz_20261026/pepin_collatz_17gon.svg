12" fill="#0b0b0b" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal" dominant-baseline="middle">vertex 1 = the trivial Collatz cycle (fixed by A)</text><line x1="22.0" y1="90.0" x2="40.0" y2="90.0" stroke="#eb6834" stroke-width="2.6" stroke-linecap="round"/><text x="46.0" y="90.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal" dominant-baseline="middle">integer Fermat line 17 → 13 → 10</text><line x1="352.0" y1="66.0" x2="370.0" y2="66.0" stroke="#52514e" stroke-width="1.0" stroke-linecap="round"/><text x="376.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal" dominant-baseline="middle">the Pépin cycle of A (16 steps)</text><line x1="352.0" y1="90.0" x2="370.0" y2="90.0" stroke="#1baf7a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 5"/><text x="376.0" y="90.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal" dominant-baseline="middle">mirror axis: A⁸(x) = 2 − x</text><line x1="747.5" y1="465.0" x2="805.0" y2="360.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="1063.8" y1="570.0" x2="1092.5" y2="465.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="805.0" y1="360.0" x2="920.0" y2="255.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="948.8" y1="570.0" x2="977.5" y2="465.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="718.8" y1="570.0" x2="747.5" y2="465.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="833.8" y1="570.0" x2="862.5" y2="465.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="977.5" y1="465.0" x2="1035.0" y2="360.0" stroke="#c9c8c2" stroke-width="1.3" stroke-linecap="round"/><line x1="1092.5" y1="465.0" x2="1035.0" y2="360.0" stroke="#c9c8c2" stroke-width="1.3" s