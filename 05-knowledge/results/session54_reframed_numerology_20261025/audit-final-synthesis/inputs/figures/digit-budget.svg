<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Finite digit budgets: exact counts, different limits</title><desc id="desc">Base-nine digit-budget state transfer and exact residue counts. Fixed finite budget gives completed 3-adic dimension one half, not finiteness of ordinary exponents.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#30465c"/></marker></defs>
<rect width="1200" height="1000" fill="#ffffff"/>
<text x="40" y="47" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#152b40" text-anchor="start">Finite digit budgets: exact counts, different limits</text>
<text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#152b40" text-anchor="start">Lowest r base-9 digits of 2^k • r ≥ 1 • fixed integer budget b ≥ 0</text>
<rect x="40" y="110" width="1120" height="113" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="144" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Digit rule and the correct initial level</text>
<text x="60" y="177" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Normal digits {0,1,2}; debt digits {3,4,5}; digits {6,7,8} forbidden.</text>
<text x="60" y="206" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">At r = 1: unit digits {1,2} give debt 0; {4,5} give debt 1.</text>
<text x="40" y="262" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">State j = number of debt digits already used</text>
<rect x="40" y="291" width="300" height="111" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="325" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">State j</text>
<text x="60" y="358" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">0 ≤ j &lt; b</text>
<text x="60" y="387" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Count v_r(j)</text>
<rect x="650" y="270" width="510" height="85" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="670" y="304" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">State j</text>
<text x="670" y="337" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">3 lifts: append 0, 1, or 2</text>
<rect x="650" y="381" width="510" height="85" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="670" y="415" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">State j + 1</text>
<text x="670" y="448" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">3 lifts: append 3, 4, or 5</text>
<path d="M340,323 L650,313" fill="none" stroke="#30465c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495.0" y="306.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b40" text-anchor="middle">no new debt</text>
<path d="M340,365 L650,424" fill="none" stroke="#30465c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495.0" y="382.5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b40" text-anchor="middle">spend one debt</text>
<text x="40" y="445" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">At j = b: only the 3 no-debt lifts survive.</text>
<text x="40" y="477" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Debt overflow is discarded; it never wraps around.</text>
<rect x="40" y="505" width="1120" height="158" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="539" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Exact transfer and residue-class counts</text>
<text x="60" y="572" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">v_(r+1) = 3(I + N)v_r;  N e_j = e_(j+1),  N e_b = 0.</text>
<text x="60" y="601" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">v_1 = (2) for b = 0;  v_1 = (2,2,0,…,0) for b ≥ 1.</text>
<text x="60" y="630" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">A_(r,b) = 2 · 3^(r−1) Σ_{j=0}^b binom(r,j);  M_r = 6 · 9^(r−1).</text>
<rect x="40" y="687" width="540" height="121" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="721" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Finite-level check: r = 10</text>
<text x="60" y="754" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">b = 0: 39,366 classes</text>
<text x="60" y="783" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">b = 1: 433,026 classes</text>
<rect x="610" y="687" width="550" height="121" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="630" y="721" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Fixed b: polynomial × exponential</text>
<text x="630" y="754" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">One Jordan block: size b + 1; eigenvalue 3.</text>
<text x="630" y="783" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Extra debt changes r^b, not the base 3.</text>
<rect x="40" y="831" width="1120" height="115" rx="8" fill="#fff4df" stroke="#8b9ba8"/>
<text x="60" y="865" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Keep the two questions separate</text>
<text x="60" y="898" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Admissible set in (Z/2Z) × Z₃: dimension 1/2 and Haar measure zero.</text>
<text x="60" y="927" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Ordinary k ≥ 0, full expansion of 2^k: finiteness or infinitude is NOT settled.</text>
<text x="40" y="978" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#152b40" text-anchor="start">Sources: sources/cross-base.md; sources/budget-transfer.md. b ≥ 2 is combinatorial, not a coefficient congruence.</text>
</svg>
