<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc">
<title id="title">Native boundary quotient and a separately defined incidence lift</title><desc id="desc">A commuting square identifies 63 native blockers modulo their boundary fibers with 21 projective points. A new typed trace incidence has 42 objects and 105 flags; its threefold vertex blow-up has 126 vertices, 945 edges, and degree 15.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#30465c"/></marker></defs>
<rect width="1200" height="1140" fill="#ffffff"/>
<text x="40" y="47" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="bold" fill="#152b40" text-anchor="start">Native boundary quotient → a separately defined incidence</text>
<text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Solid arrows below are the proved quotient maps and bijections, not graph-cover claims.</text>
<rect x="40" y="115" width="420" height="100" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="149" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">63 native Paley-7 blockers</text>
<text x="60" y="182" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">B: exact deleted-arc subsets</text>
<rect x="740" y="115" width="420" height="100" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="760" y="149" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">63 nonzero field vectors</text>
<text x="760" y="182" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Ψ(B) = g^e ∈ F₆₄× (adjusted coding)</text>
<path d="M460,161 L740,161" fill="none" stroke="#30465c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="149.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b40" text-anchor="middle">bijection Ψ</text>
<rect x="40" y="330" width="420" height="100" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="364" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">21 native boundary images</text>
<text x="60" y="397" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">∂B: endpoint XOR of deleted arcs</text>
<rect x="740" y="330" width="420" height="100" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="760" y="364" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">21 points of PG(2,4)</text>
<text x="760" y="397" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">[g^e] = g^e F₄×</text>
<path d="M250,215 L250,330" fill="none" stroke="#30465c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="271" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#152b40" text-anchor="start">∂</text>
<path d="M950,215 L950,330" fill="none" stroke="#30465c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970" y="271" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b40" text-anchor="start">quotient</text>
<path d="M460,378 L740,378" fill="none" stroke="#30465c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="366.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b40" text-anchor="middle">ρ⁻¹ identification</text>
<text x="40" y="476" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#152b40" text-anchor="start">Commuting square: ∂B = ρ(e mod 21). Each fiber has exactly 3 blockers.</text>
<text x="40" y="511" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#152b40" text-anchor="start">Scalar fiber: {g^e, g^(e+21), g^(e+42)} represents ONE point, not a line.</text>
<text x="40" y="546" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#152b40" text-anchor="start">A projective line has 5 points. Native arc intersection is not the relation below.</text>
<path d="M40,579 L1160,579" stroke="#8b9ba8" stroke-width="2"/>
<text x="40" y="618" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#152b40" text-anchor="start">NEW relation: add a point type and a line type</text>
<rect x="40" y="645" width="540" height="158" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="60" y="679" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Typed quotient incidence</text>
<text x="60" y="712" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">21 points e + 21 lines ℓ = 42 objects.</text>
<text x="60" y="741" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Incident exactly when Tr(g^(e−ℓ)) = 0.</text>
<text x="60" y="770" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">105 flags; every object has degree 5.</text>
<rect x="610" y="645" width="550" height="158" rx="8" fill="#eef4f8" stroke="#8b9ba8"/>
<text x="630" y="679" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">Lift through actual boundary fibers</text>
<text x="630" y="712" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">63 point-type + 63 line-type blockers = 126.</text>
<text x="630" y="741" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Each flag lifts to a complete bipartite K₃,₃.</text>
<text x="630" y="770" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">105 × 9 = 945 edges; degree 5 × 3 = 15.</text>
<rect x="40" y="828" width="1120" height="117" rx="8" fill="#fff4df" stroke="#8b9ba8"/>
<text x="60" y="862" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#152b40" text-anchor="start">The precise lift: a threefold vertex blow-up</text>
<text x="60" y="895" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Each quotient object has 3 blockers above it; every base flag becomes all 9 pairs.</text>
<text x="60" y="924" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Not a locally bijective graph covering: one base neighbor lifts to 3 neighbors.</text>
<text x="40" y="987" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#152b40" text-anchor="start">Converse with a type switch: (e, point) ↔ (−e, line) is trace polarity.</text>
<text x="40" y="1022" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#152b40" text-anchor="start">Point-only inversion [x] → [x⁻¹] is NOT a collineation of this PG(2,4).</text>
<text x="40" y="1062" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#152b40" text-anchor="start">Tr(z) = z + z⁴ + z¹⁶. New trace incidence is not native arc-intersection incidence.</text>
<text x="40" y="1113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#152b40" text-anchor="start">Sources: sources/boundary.md; sources/two-sheet.md. The figures introduce no additional relation or theorem.</text>
</svg>
