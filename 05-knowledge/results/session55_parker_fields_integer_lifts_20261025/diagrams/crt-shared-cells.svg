<text x="728" y="307" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#102a43">→</text>
<text x="36" y="459" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#102a43">A: {0,4,8}  {2,3,7}  {1,5,6}</text>
<text x="414" y="459" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#102a43">B: {2,4,6}  {0,5,7}  {1,3,8}</text>
<text x="792" y="459" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#102a43">Equal modulo 35 ⇔ equal locally</text>
<text x="36" y="490" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#486581">Colour = equal residues within each local grid; cell numbers stay fixed.</text>
<rect x="36" y="515" width="1108" height="79" rx="8" fill="#eaf2f8" stroke="#bcccdc"/>
<text x="58" y="547" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#102a43">C₃₅ = C₅ ∩ C₇ = ∅</text>
<text x="465" y="545" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#102a43">Each A-block meets each B-block in one cell.</text>
<text x="465" y="574" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#486581">No pair of different cells remains equal in both factors.</text>
<rect x="36" y="616" width="1108" height="128" rx="8" fill="#fff4e8" stroke="#dca45d"/>
<text x="58" y="650" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#102a43">Modular magic is not integer magic.</text>
<text x="58" y="684" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#102a43">Ordinary row sums: 10, 45, 80. They differ, but all are 10 modulo 35.</text>
<text x="58" y="716" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#486581">Every entry is a square residue modulo 35; that does not make it an integer square.</text>
<text x="36" y="773" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#486581">Source: CRT collision-wiring theorem, §§2, 4–5. Exact witness and collision masks are replay-checked.</text>
</svg>
