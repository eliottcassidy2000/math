<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790" role="img" aria-labelledby="title desc">
<title id="title">CRT resolves local collisions, not integer squarehood</title><desc id="desc">The same nine cell labels in two local square-residue grids modulo 5 and 7 combine to nine distinct square residues modulo 35. Their ordinary row sums differ.</desc>
<rect width="1180" height="790" fill="#f8fafc"/>
<text x="36" y="49" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#102a43">Shared cell labels are the missing CRT information</text>
<text x="36" y="82" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#486581">Parker = no magic grid with nine distinct square entries. Zero is allowed.</text>
<text x="36" y="128" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#102a43">LOCAL: modulo 5</text>
<text x="414" y="128" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#102a43">LOCAL: modulo 7</text>
<text x="792" y="128" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#102a43">PRODUCT: modulo 35</text>
<text x="36" y="157" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#486581">Parker; 3 square values here</text>
<text x="414" y="157" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#486581">Parker; 3 square values here</text>
<text x="792" y="157" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#486581">Non-Parker; 9 distinct values</text>
